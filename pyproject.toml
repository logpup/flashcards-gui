[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-flashcards"
version = "0.1.0"
description = "Korean flashcard application"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # This tells pytest where to find modules
# Remove or comment out asyncio_mode for now
# asyncio_mode = "auto"  # We'll add this back when we need async tests